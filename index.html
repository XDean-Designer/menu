              </div>
              <div class="catalog-action-list">
                <button type="button" class="catalog-action-item" data-catalog-act="group">设置分组</button>
                <button type="button" class="catalog-action-item" data-catalog-act="sale">下架</button>
                <button type="button" class="catalog-action-item" data-catalog-act="hide">隐藏</button>
                <button type="button" class="catalog-action-item hidden" data-catalog-act="unhide">取消隐藏</button>
                <button type="button" class="catalog-action-item catalog-action-item--danger" data-catalog-act="delete">删除<span class="catalog-action-item__del-lock is-hidden" id="catalogActDeleteLock" aria-hidden="true"></span></button>
              </div>
            </div>
            <div class="catalog-action-foot">
              <button type="button" class="catalog-action-item catalog-action-item--cancel" data-catalog-act="cancel">取消</button>
            </div>
            <div class="catalog-action-safe" aria-hidden="true"></div>
          </div>
        </div>

        <div class="picker-mask picker-mask--bottom" id="catalogItemGroupMask">
          <div class="picker-sheet tall">
            <div class="picker-head picker-head--stack">
              <div class="picker-head__title" id="catalogItemGroupTitle">设置分组</div>
              <div class="picker-head__sub">可同时加入多个分组</div>
            </div>
            <div class="catalog-group-sheet-list" id="catalogItemGroupList"></div>
            <div class="picker-foot picker-foot--row">
              <button type="button" class="btn-main secondary" id="catalogItemGroupCancel">取消</button>
              <button type="button" class="btn-main" id="catalogItemGroupConfirm">确定</button>
            </div>
          </div>
        </div>


        <div class="picker-mask picker-mask--bottom" id="amountKeypadMask">
          <div class="picker-sheet">
            <div class="picker-head" id="amountKeypadTitle">输入金额</div>
            <div class="amount-keypad-display is-empty" id="amountKeypadDisplay">请输入</div>
            <div class="amount-keypad-grid" id="amountKeypadGrid"></div>
            <div class="picker-foot picker-foot--row">
              <button type="button" class="btn-main secondary" id="btnAmountKeypadCancel">取消</button>
              <button type="button" class="btn-main" id="btnAmountKeypadOk">确定</button>
            </div>
          </div>
        </div>

<!-- ==== /PRICE CATALOG ==== -->

      <div class="toast-msg" id="toastMsg" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
<script src="amount-keypad.js"></script>
<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
