        <div class="screen hidden" id="screen-p-groups">

            <span class="title">分组管理</span>
            <button type="button" class="btn-catalog-group-create" id="btnCatalogGroupCreate" aria-label="新建"><svg class="btn-catalog-group-create__plus" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="btn-catalog-group-create__text">新建</span></button>
          </header>
          <div class="page-body">
            <div class="catalog-group-manage-list" id="catalogGroupManageList"></div>
            <div class="catalog-group-manage-empty hidden" id="catalogGroupManageEmpty">
              <div class="catalog-group-manage-empty__icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h10M4 17h6"/></svg>
              </div>
              <p class="catalog-group-manage-empty__title">暂无分组</p>
              <p class="catalog-group-manage-empty__hint">创建分组后可快速筛选价目表</p>

          </div>

        <div class="screen hidden" id="screen-p-group-members">
          <header class="page-title-bar">
            <button type="button" class="back" id="projBackFromGroupMembers" aria-label="返回"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>

              <button type="button" class="pick-select-bar__btn" id="btnCatalogMembersInvert">反选</button>
              <button type="button" class="pick-select-bar__btn" id="btnCatalogMembersSelectAll">全选</button>

        </div>

        <div class="picker-mask picker-mask--bottom" id="durPickerMask">
          <div class="picker-sheet">
            <div class="picker-head picker-head--validity"><span class="picker-head__title-main">项目时长</span></div>
            <div class="validity-sheet-body">
              <div class="validity-chip-row validity-chip-row--presets" id="durChipRow"></div>
              <div class="ios-picker" id="durHmPicker">
                <div class="ios-picker-highlight"></div>
                <div class="ios-picker-cols">
                  <div class="ios-picker-col" id="durHourCol"></div>
                  <div class="ios-picker-col" id="durMinCol"></div>
                </div>
              </div>
            </div>
            <div class="picker-foot picker-foot--row">
              <button type="button" class="btn-main secondary" id="btnDurCancel">取消</button>
              <button type="button" class="btn-main" id="btnDurOk">确定</button>
            </div>
          </div>
        </div>

        <div class="dialog-mask" id="projDialogMask">
          <div class="dialog">
            <div class="dialog__title">确认删除？</div>
            <div class="dialog__body">删除后不可恢复，是否继续？</div>
            <div class="dialog__actions">
              <button type="button" class="btn-main secondary" id="projDialogCancel">取消</button>
              <button type="button" class="btn-main" id="projDialogConfirm">删除</button>
            </div>
          </div>
        </div>

        <div class="dialog-mask" id="catalogInlineDiscardMask">
          <div class="dialog">
            <div class="dialog__title">放弃修改？</div>
            <div class="dialog__body">这一项还有没保存的改动，收起后将不会保留。</div>
            <div class="dialog__actions">
              <button type="button" class="btn-main secondary" id="catalogInlineDiscardAbort">继续编辑</button>
              <button type="button" class="btn-main" id="catalogInlineDiscardOk">放弃</button>
            </div>
          </div>
        </div>

        <div class="dialog-mask" id="catalogGroupNameMask">
          <div class="dialog">
            <div class="dialog__title" id="catalogGroupNameTitle">新建分组</div>
            <input type="text" class="catalog-group-name-field" id="catalogGroupNameInput" placeholder="请输入分组名称" maxlength="20" autocomplete="off">
            <p class="catalog-group-name-hint">最多 20 字，不可与已有分组重名</p>
            <div class="dialog__actions">
              <button type="button" class="btn-main secondary" id="catalogGroupNameCancel">取消</button>
              <button type="button" class="btn-main" id="catalogGroupNameConfirm">确定</button>
            </div>
          </div>
        </div>


        <div class="dialog-mask" id="catalogGroupDeleteMask">
          <div class="dialog">
            <div class="dialog__title">删除分组？</div>
            <div class="dialog__body">仅删除分组，不会删除项目/产品。</div>
            <div class="dialog__actions">
              <button type="button" class="btn-main secondary" id="catalogGroupDeleteCancel">取消</button>
              <button type="button" class="btn-main" id="catalogGroupDeleteConfirm">删除</button>
            </div>
          </div>
        </div>

        <div class="dialog-mask" id="unlimitedValidityDialogMask">
          <div class="dialog">
            <div class="dialog__title">设置有效期</div>
            <div class="dialog__body">不限次项目不可使用永久有效，请在此设置卡有效期。</div>
            <div class="unlimited-validity-dialog__dur">
              <div class="duration-input" id="unlimitedValidityDuration" data-duration-id="unlimitedValidity" style="width:166px">
                <div class="duration-input__field" data-duration-field>
                  <input type="text" class="duration-input__num" data-duration-num inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="请输入" />
                </div>
                <div class="duration-input__units" data-duration-units style="grid-template-columns:repeat(3,1fr);flex:0 0 90px;width:90px">
                  <span class="duration-seg-indicator" style="width:calc((100% - 4px) / 3);transform:translateX(200%)" aria-hidden="true"></span>
                  <button type="button" class="duration-input__unit" data-duration-unit="day">日</button>
                  <button type="button" class="duration-input__unit" data-duration-unit="month">月</button>
                  <button type="button" class="duration-input__unit is-active" data-duration-unit="year">年</button>
                </div>
              </div>
            </div>
            <div class="dialog__actions">
              <button type="button" class="btn-main secondary" id="unlimitedValidityCancel">取消</button>
              <button type="button" class="btn-main" id="unlimitedValidityConfirm">确定</button>
            </div>
          </div>
        </div>

        <div class="picker-mask picker-mask--bottom" id="catalogRowActionMask">
          <div class="picker-sheet picker-sheet--menu">
            <div class="catalog-action-card">
              <div class="picker-sheet__grabber" aria-hidden="true"></div>
              <div class="picker-head picker-head--stack">
                <div class="picker-head__title" id="catalogRowActionTitle">项目</div>
              </div>
              <div class="catalog-action-list">
                <button type="button" class="catalog-action-item" data-catalog-act="group">设置分组</button>
                <button type="button" class="catalog-action-item" data-catalog-act="sale">下架</button>
                <button type="button" class="catalog-action-item" data-catalog-act="hide">隐藏</button>
                <button type="button" class="catalog-action-item hidden" data-catalog-act="unhide">取消隐藏</button>
                <button type="button" class="catalog-action-item catalog-action-item--danger" data-catalog-act="delete">删除<span class="catalog-action-item__del-lock is-hidden" id="catalogActDeleteLock" aria-hidden="true"></span></button>
              </div>
            </div>
            <div class="catalog-action-foot">
              <button type="button" class="catalog-action-item catalog-action-item--cancel" data-catalog-act="cancel">取消</button>
            </div>
            <div class="catalog-action-safe" aria-hidden="true"></div>
          </div>
        </div>

        <div class="picker-mask picker-mask--bottom" id="catalogItemGroupMask">
          <div class="picker-sheet tall">
            <div class="picker-head picker-head--stack">
              <div class="picker-head__title" id="catalogItemGroupTitle">设置分组</div>
              <div class="picker-head__sub">可同时加入多个分组</div>
            </div>
            <div class="catalog-group-sheet-list" id="catalogItemGroupList"></div>
            <div class="picker-foot picker-foot--row">
              <button type="button" class="btn-main secondary" id="catalogItemGroupCancel">取消</button>
              <button type="button" class="btn-main" id="catalogItemGroupConfirm">确定</button>
            </div>
          </div>
        </div>


        <div class="picker-mask picker-mask--bottom" id="amountKeypadMask">
          <div class="picker-sheet">
            <div class="picker-head" id="amountKeypadTitle">输入金额</div>
            <div class="amount-keypad-display is-empty" id="amountKeypadDisplay">请输入</div>
            <div class="amount-keypad-grid" id="amountKeypadGrid"></div>
            <div class="picker-foot picker-foot--row">
              <button type="button" class="btn-main secondary" id="btnAmountKeypadCancel">取消</button>
              <button type="button" class="btn-main" id="btnAmountKeypadOk">确定</button>
            </div>
          </div>
        </div>
